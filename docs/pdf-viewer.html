<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de PDF</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
        }
        #pdf-viewer {
            width: 100%;
            height: 80vh;
            margin: 20px 0;
            border: 1px solid #ddd;
            background-color: #fff;
            overflow: auto;
            text-align: center;
        }
        canvas {
            display: inline-block;
            margin: 0 auto;
            border: 1px solid #eee;
        }
        input, button {
            padding: 8px;
            margin: 5px 0;
        }
        .controls {
            margin-bottom: 20px;
        }
        .fallback {
            margin-top: 20px;
            font-style: italic;
        }
        .footer-bar {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            background: #f0f0f0;
            border-radius: 5px;
        }
        button {
            padding: 8px 15px;
            background: #4b91e2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #3a7bc8;
        }
    </style>
</head>
<body>
    <h1>Visor de PDF</h1>
    
    <div class="controls">
        <input type="file" id="file-input" accept="application/pdf">
        <input type="text" id="url-input" placeholder="Introduce la URL del PDF">
        <button id="load-pdf">Cargar PDF</button>
    </div>
    
    <div id="pdf-viewer">Cargando PDF...</div>
    
    <div class="fallback">
        <p>Si no puedes ver el PDF, <span id="download-link">descárgalo directamente</span>.</p>
    </div>
    
    <div class="footer-bar">
        <button onclick="window.history.back()">⬅ Retroceder</button>
        <button onclick="window.location.href='index.html'">🏠 Página de Inicio</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const pdfViewer = document.getElementById('pdf-viewer');
        const fileInput = document.getElementById('file-input');
        const urlInput = document.getElementById('url-input');
        const loadButton = document.getElementById('load-pdf');
        const downloadLink = document.getElementById('download-link');

        function renderPDF(url) {
            pdfViewer.innerHTML = 'Cargando PDF...';
            
            pdfjsLib.getDocument(url).promise.then(pdf => {
                const numPages = pdf.numPages;
                const container = document.createElement('div');
                pdfViewer.innerHTML = '';
                pdfViewer.appendChild(container);
                
                // Renderizar cada página del PDF
                for (let pageNum = 1; pageNum <= numPages; pageNum++) {
                    renderPage(pdf, pageNum, container);
                }
            }).catch(docError => {
                pdfViewer.innerHTML = 'No se pudo cargar el PDF. Error: ' + docError.message;
                console.error('Document Error:', docError);
            });
        }
        
        function renderPage(pdf, pageNumber, container) {
            pdf.getPage(pageNumber).then(page => {
                const pageContainer = document.createElement('div');
                pageContainer.className = 'pdf-page';
                pageContainer.style.margin = '10px 0';
                container.appendChild(pageContainer);
                
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                const containerWidth = pdfViewer.clientWidth - 40; // Margen
                const viewport = page.getViewport({ scale: 1 });
                const scale = containerWidth / viewport.width;
                const adjustedViewport = page.getViewport({ scale });

                const outputScale = window.devicePixelRatio || 1;
                canvas.width = Math.floor(adjustedViewport.width * outputScale);
                canvas.height = Math.floor(adjustedViewport.height * outputScale);
                canvas.style.width = `${adjustedViewport.width}px`;
                canvas.style.height = `${adjustedViewport.height}px`;

                context.scale(outputScale, outputScale);
                pageContainer.appendChild(canvas);

                const renderContext = {
                    canvasContext: context,
                    viewport: adjustedViewport
                };

                // Modificado: Usar try/catch en lugar de .catch() para manejar errores de renderizado
                try {
                    page.render(renderContext);
                } catch (renderError) {
                    pageContainer.innerHTML = `Error al renderizar la página ${pageNumber} del PDF.`;
                    console.error('Render Error:', renderError);
                }
            }).catch(pageError => {
                container.innerHTML += `<p>Error al cargar la página ${pageNumber} del PDF.</p>`;
                console.error('Page Error:', pageError);
            });
        }

        // Detectar y cargar PDF desde parámetros URL
        function getParameterByName(name) {
            const url = window.location.href;
            name = name.replace(/[\[\]]/g, '\\$&');
            const regex = new RegExp('[?&]' + name + '(=([^&#]*)|&|#|$)');
            const results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, ' '));
        }

        // Cargar desde botón
        loadButton.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (url) {
                renderPDF(url);
                downloadLink.innerHTML = `<a href="${url}" download>descárgalo aquí</a>`;
            } else {
                alert('Por favor, introduce una URL válida.');
            }
        });

        // Cargar desde input file
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                renderPDF(fileURL);
                downloadLink.innerHTML = `<a href="${fileURL}" download="${file.name}">descárgalo aquí</a>`;
            }
        });

        // Comprobar si se proporciona un archivo en la URL
        window.addEventListener('DOMContentLoaded', () => {
            const fileParam = getParameterByName('file');
            if (fileParam) {
                urlInput.value = fileParam;
                renderPDF(fileParam);
                downloadLink.innerHTML = `<a href="${fileParam}" download>descárgalo aquí</a>`;
            }
        });
    </script>
</body>
</html>
