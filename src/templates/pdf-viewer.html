<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Visor de PDF</title>
    <link rel="stylesheet" href="css/pdf-viewer.css" />
  </head>
  <body>
    <div id="pdf-container">
      <div id="pdf-viewer"></div>
      <div class="controls">
        <div class="control-group page-nav">
          <button id="prev" title="Página anterior">⬅️ Anterior</button>
          <span class="page-indicator">
            Página <input type="number" id="page-num" min="1" value="1" aria-label="Número de página">
            de <span id="page-count">0</span>
          </span>
          <button id="next" title="Página siguiente">Siguiente ➡️</button>
        </div>

        <div class="control-group zoom-actions">
          <button id="zoom-out" title="Reducir">-</button>
          <span id="zoom-level">100%</span>
          <button id="zoom-in" title="Ampliar">+</button>
        </div>

        <div class="control-group fit-actions">
          <button id="fit-width" title="Ajustar al ancho">↔</button>
          <button id="fit-height" title="Ajustar al alto">↕</button>
        </div>

        <div class="control-group view-actions">
          <button id="fullscreen" title="Pantalla completa">↗️ Pantalla completa</button>
          <a href="#" id="download-btn" class="action-button" title="Descargar PDF" style="display: none; text-decoration: none; margin-left: 10px;">📥 Descargar</a>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      window['pdfjs-dist/build/pdf'].GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="scripts/pdf-viewer.js"></script>
  </body>
</html>
