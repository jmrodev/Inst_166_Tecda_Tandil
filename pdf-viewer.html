<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de PDF</title>
    <style>
        /* ...existing code... */
    </style>
</head>
<body>
    <h1>Visor de PDF</h1>
    <input type="file" id="file-input" accept="application/pdf">
    <input type="text" id="url-input" placeholder="Introduce la URL del PDF">
    <button id="load-pdf">Cargar PDF</button>
    <div id="pdf-viewer">Cargando PDF...</div>
    <div class="fallback">
        <p>Si no puedes ver el PDF, <span id="download-link"></span>.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        const pdfViewer = document.getElementById('pdf-viewer');
        const fileInput = document.getElementById('file-input');
        const urlInput = document.getElementById('url-input');
        const loadButton = document.getElementById('load-pdf');
        const downloadLink = document.getElementById('download-link');

        function renderPDF(url) {
            pdfjsLib.getDocument(url).promise.then(pdf => {
                pdf.getPage(1).then(page => {
                    const containerWidth = pdfViewer.clientWidth;
                    const viewport = page.getViewport({ scale: 1 });
                    const scale = containerWidth / viewport.width;
                    const adjustedViewport = page.getViewport({ scale });

                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    const outputScale = window.devicePixelRatio || 1;
                    canvas.width = Math.floor(adjustedViewport.width * outputScale);
                    canvas.height = Math.floor(adjustedViewport.height * outputScale);
                    canvas.style.width = `${adjustedViewport.width}px`;
                    canvas.style.height = `${adjustedViewport.height}px`;

                    context.scale(outputScale, outputScale);

                    pdfViewer.innerHTML = '';
                    pdfViewer.appendChild(canvas);

                    const renderContext = {
                        canvasContext: context,
                        viewport: adjustedViewport
                    };

                    page.render(renderContext).catch(renderError => {
                        pdfViewer.innerHTML = 'Error al renderizar la página del PDF.';
                        console.error('Render Error:', renderError);
                    });
                }).catch(pageError => {
                    pdfViewer.innerHTML = 'Error al cargar la página del PDF.';
                    console.error('Page Error:', pageError);
                });
            }).catch(docError => {
                pdfViewer.innerHTML = 'No se pudo cargar el PDF.';
                console.error('Document Error:', docError);
            });
        }

        loadButton.addEventListener('click', () => {
            const url = urlInput.value.trim();
            if (url) {
                renderPDF(url);
                downloadLink.innerHTML = `<a href="${url}" download>descárgalo aquí</a>`;
            } else {
                alert('Por favor, introduce una URL válida.');
            }
        });

        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                const fileURL = URL.createObjectURL(file);
                renderPDF(fileURL);
                downloadLink.innerHTML = `<a href="${fileURL}" download>descárgalo aquí</a>`;
            }
        });
    </script>
</body>
</html>
